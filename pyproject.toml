[project]
name = "rad-marl"
version = "0.1.0"
description = "A JAX implementation of Automata-Conditioned Reinforcement Learning (AC-RL)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dfa-gym>=0.2.14",
    "dfax>=0.1.13",
    "wandb==0.25.1",
    "distrax==0.1.5",
    "pandas==2.3.2",
    "rad-embeddings>=0.2.3",
    "dfa-gym",
]

[project.optional-dependencies]
cuda = [
    "dfa-gym[cuda]>=0.2.14",
    "dfax[cuda]>=0.1.13",
]

[tool.uv.sources]
# DroneEnv only exists on ../dfa-gym's unmerged `drone_env` branch (not yet
# published to PyPI as of dfa-gym 0.2.18) -- point at the local checkout
# until a release with DroneEnv ships, then revert to the PyPI pin above.
dfa-gym = { path = "../dfa-gym", editable = true }
rad-embeddings = { path = "../rad-embeddings", editable = true }
